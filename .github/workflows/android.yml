name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The Gradle step re-reads app.config.js when it bundles the JS, so the build number
    # has to be set for the whole job, not just prebuild.
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npx tsc --noEmit

      # Live update: phones on the same native version pick this up next time Halo opens,
      # with no APK install. Skipped until the Expo token and project are set up.
      - name: Publish live update
        if: env.EXPO_TOKEN != ''
        run: |
          if ! grep -q "projectId = process.env.EXPO_PROJECT_ID || '[0-9a-f-]\+'" app.config.js && [ -z "$EXPO_PROJECT_ID" ]; then
            echo "No Expo project id yet, skipping."; exit 0
          fi
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest update --channel production --platform android --non-interactive \
            --message "Build ${{ github.run_number }} (${GITHUB_SHA::7})"

      - name: Read native version
        run: echo "NATIVE=$(node -p "require('./app.config.js')({config:{android:{permissions:[]},extra:{}}}).extra.native")" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install --clean

      # Same signing key every build, so a new APK installs over the old one and keeps her data.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/halo.jks"; fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          report() {
            # Surface Gradle's error as annotations so it can be read without the full log.
            { grep -m1 -A6 "What went wrong" build.log; grep -m3 -E "^e: |error:" build.log; } | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          trap report ERR
          if [ -f "$RUNNER_TEMP/halo.jks" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/halo.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=halo \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" 2>&1 | tee build.log
          else
            ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Halo.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Halo-apk
          path: Halo.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Halo.apk --title "Halo build ${{ github.run_number }} native $NATIVE" --notes "Built from ${GITHUB_SHA::7}. Open this page on her phone and tap Halo.apk to install."
