name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install --clean
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Same signing key every build, so a new APK installs over the old one and keeps her data.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/halo.jks"; fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/halo.jks" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/halo.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=halo \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          else
            ./gradlew assembleRelease --no-daemon
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Halo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Halo-apk
          path: Halo.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Halo.apk --title "Halo build ${{ github.run_number }}" --notes "Built from ${GITHUB_SHA::7}. Open this page on her phone and tap Halo.apk to install."
